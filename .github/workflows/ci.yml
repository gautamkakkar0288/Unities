name: CI

on:
  push:
    branches: [main]
  pull_request:

# Needed so the job can post the verification report back to the pull request.
permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # The database-backed half of the verification matrix needs a real Postgres.
    # Mocks cannot be wrong about transactional count arithmetic or unique
    # constraints, which is precisely what those tests are checking.
    #
    # It also starts empty on every run, which is what makes the migrate step
    # meaningful: clean database -> migrate -> seed -> tests, from nothing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cirqles_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cirqles_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # One step runs the whole matrix rather than one step per command. A
      # step-per-command stops at the first failure, which tells you the
      # earliest problem and nothing else; running them all tells you whether
      # you have one bug or ten.
      - name: Run the verification matrix
        id: matrix
        shell: bash
        run: |
          set +e
          : > report.md
          : > detail.md
          overall=0

          {
            echo "## Verification matrix"
            echo ""
            echo "Commit \`${GITHUB_SHA::7}\`"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
          } >> report.md

          run() {
            local name="$1"; shift
            local out code
            echo "::group::${name}"
            out="$("$@" 2>&1)"
            code=$?
            printf '%s\n' "${out}"
            echo "::endgroup::"

            if [ "${code}" -eq 0 ]; then
              echo "| ${name} | pass |" >> report.md
            else
              echo "| ${name} | **FAIL** (exit ${code}) |" >> report.md
              {
                echo ""
                echo "<details><summary>${name} - exit ${code}</summary>"
                echo ""
                echo '```'
                printf '%s\n' "${out}" | tail -n 120
                echo '```'
                echo ""
                echo "</details>"
              } >> detail.md
              overall=1
            fi
          }

          # ci, not install: install may resolve a tree the lockfile does not
          # describe, so a green run would say nothing about what a deployment
          # installs. ci fails when package.json and the lockfile disagree.
          run "npm ci" npm ci

          run "typecheck" npm run typecheck
          run "lint" npm run lint

          # DATABASE_URL is deliberately unset here, so the database suites skip
          # themselves and this run proves the pure suites stand on their own.
          run "unit tests (no database)" npm run test

          run "build" npm run build

          # The committed migrations must already describe the schema, so
          # generate has to be a no-op. If it writes a file, someone changed a
          # table without generating the migration for it.
          run "db:generate (drift check)" env DATABASE_URL="${TEST_DATABASE_URL}" npm run db:generate

          drift="$(git status --porcelain drizzle)"
          if [ -n "${drift}" ]; then
            echo "| migrations are current | **FAIL** |" >> report.md
            {
              echo ""
              echo "<details><summary>migrations are current - drift detected</summary>"
              echo ""
              echo "\`db:generate\` produced changes, so the schema in \`lib/db/schema\` is ahead of the committed migrations in \`drizzle/\`. Run \`npm run db:generate\` locally and commit the result."
              echo ""
              echo '```'
              printf '%s\n' "${drift}"
              echo '```'
              echo ""
              echo "</details>"
            } >> detail.md
            overall=1
          else
            echo "| migrations are current | pass |" >> report.md
          fi

          # migrate, not push. push diffs the live database against the schema
          # file and mutates it in place: it can arrive at a state no migration
          # could produce, and leaves nothing to roll back. Against an empty
          # service container this proves the chain a deployment actually runs.
          run "db:migrate (clean database)" env DATABASE_URL="${TEST_DATABASE_URL}" npm run db:migrate

          run "db:seed" env DATABASE_URL="${TEST_DATABASE_URL}" npm run db:seed
          run "verification matrix (with database)" env DATABASE_URL="${TEST_DATABASE_URL}" npm run test

          cat detail.md >> report.md

          {
            echo ""
            echo "### Committed migrations"
            echo ""
          } >> report.md

          if ls drizzle/*.sql >/dev/null 2>&1; then
            {
              echo '```'
              ls -1 drizzle/*.sql
              echo '```'
            } >> report.md
          else
            echo "_No migration files are committed._" >> report.md
            overall=1
          fi

          echo "${overall}" > status.txt

      - name: Post the report to the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.number }}" \
            --repo "${{ github.repository }}" \
            --body-file report.md

      - name: Fail the job if any step failed
        if: always()
        shell: bash
        run: |
          status="$(cat status.txt 2>/dev/null || echo 1)"
          if [ "${status}" != "0" ]; then
            echo "One or more verification steps failed. See the report on the pull request."
            exit 1
          fi
